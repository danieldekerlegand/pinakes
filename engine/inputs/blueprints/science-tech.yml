# Science, technology & inventions — verified Wikidata classes for the corpus.
#
# 6 classes, ~1,903 entities. Each class's `instance of` (P31) count was
# verified live against the Wikidata Query Service (2026-06); the count after
# each entry is that observed value. Classes resolving to zero entities are not
# shipped.
#
# The domain captures the lineage of human-made techniques and devices, so it
# leans into the genetic/derivation axis: every stub mints DERIVED_FROM (from
# Wikidata `based on`, P144), INFLUENCED_BY (`influenced by`, P737), and
# VARIANT_OF (`derivative work`, P4969) edges, so invention chains are minted.
#
# Generate:  pinakes_engine generate blueprints/science-tech.yml \
#                --out categories --job jobs/science-tech.yml
defaults:
  label: Technology;CulturalArtifact
  dimensions: [temporal, geographic, linguistic, genetic]
  links:
    - {type: ORIGINATES_FROM, to: place}
    - {type: DERIVED_FROM, to: technology}
    - {type: INFLUENCED_BY, to: technology}
    - {type: VARIANT_OF, to: technology}
categories:
  # — Inventions (the genetic/lineage core: novel devices, methods, processes) —
  - id: inventions
    name: "invention"
    label: Invention;CulturalArtifact
    wikidata_class: Q12579633  # invention — ~159
    links:
      - {type: ORIGINATES_FROM, to: place}
      - {type: DERIVED_FROM, to: invention}
      - {type: INFLUENCED_BY, to: invention}
      - {type: VARIANT_OF, to: invention}
  # — Scientific instruments —
  - id: scientific-instruments
    name: "scientific instrument"
    label: ScientificInstrument;CulturalArtifact
    wikidata_class: Q3099911  # scientific instrument — ~394
    links:
      - {type: ORIGINATES_FROM, to: place}
      - {type: DERIVED_FROM, to: scientific-instrument}
      - {type: INFLUENCED_BY, to: scientific-instrument}
      - {type: VARIANT_OF, to: scientific-instrument}
  # — Technologies (inherits the shared technology-lineage defaults) —
  - id: technologies
    name: "technology"
    wikidata_class: Q11016  # technology — ~551
  # — Materials —
  - id: materials
    name: "material"
    label: Material;CulturalArtifact
    wikidata_class: Q214609  # material — ~338
    links:
      - {type: ORIGINATES_FROM, to: place}
      - {type: DERIVED_FROM, to: material}
      - {type: INFLUENCED_BY, to: material}
      - {type: VARIANT_OF, to: material}
  # — Vehicles —
  - id: vehicles
    name: "vehicle"
    label: Vehicle;CulturalArtifact
    wikidata_class: Q42889  # vehicle — ~200
    links:
      - {type: ORIGINATES_FROM, to: place}
      - {type: DERIVED_FROM, to: vehicle}
      - {type: INFLUENCED_BY, to: vehicle}
      - {type: VARIANT_OF, to: vehicle}
  # — Machines —
  - id: machines
    name: "machine"
    label: Machine;CulturalArtifact
    wikidata_class: Q11019  # machine — ~261
    links:
      - {type: ORIGINATES_FROM, to: place}
      - {type: DERIVED_FROM, to: machine}
      - {type: INFLUENCED_BY, to: machine}
      - {type: VARIANT_OF, to: machine}
