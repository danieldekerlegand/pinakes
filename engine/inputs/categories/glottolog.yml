# Glottolog languoid catalog ingested via the generic tabular-dump adapter.
#
# Glottolog (docs/sources-linguistic.md) is the authoritative open language-family
# tree: ~26k languoids, each with a Glottocode + ISO 639-3 code and its Family_ID
# (top-level family glottocode) — "exactly the DESCENDS_FROM genealogy this project
# links on". Its CLDF release `languages.csv` is plain CSV, so it needs only column
# mappings on the existing tabular-dump adapter (src/pinakes_engine/acquire/tabular.py),
# not new adapter code.
#
# Mappings (source CLDF column -> canonical field, docs/data-model.md):
#   Name        -> name           (languoid name)
#   Glottocode  -> language_code   (this languoid's glottocode; the linguistic linker
#                                   matches a child's parent_code against it)
#   Family_ID   -> parent_code     (top-level family glottocode; the linguistic linker
#                                   resolves it to a DESCENDS_FROM edge to that ancestor)
#   Latitude    -> lat / Longitude -> lon
# The ID column drives a per-record source_url (the languoid's Glottolog page). Every
# unmapped CLDF column (ISO639P3code, Level, Family_ID's siblings, Macroarea, ...) rides
# through into the node's `extra` overflow, so nothing is dropped.
#
# Provenance: source=glottolog, license=CC-BY-4.0 (Glottolog's release licence — travels
# with every record, per the share-alike discipline the Getty/Pleiades adapters use),
# confidence=0.8 (the `curated-verified` rubric class, src/pinakes_engine/confidence.py:
# an authoritative hand-curated catalogue).
#
# `source.query` points at the committed fixture slice so the job runs out of the box and
# in CI (network-free); repoint it at the real download (gitignored, e.g. a local CLDF
# checkout's cldf/languages.csv) to ingest the full catalogue. The path resolves relative
# to the directory `pinakes_engine run` is invoked from (the package root).
id: glottolog
label: Language
description: Glottolog languoid catalogue — languages, families, and dialects with genealogy.
source:
  type: dump
  query: tests/fixtures/glottolog/languages.csv
  params:
    adapter: tabular-dump
    format: csv
    source: glottolog
    license: CC-BY-4.0
    confidence: "0.8"
    id_column: ID
    url_template: https://glottolog.org/resource/languoid/id/{id}
    field.name: Name
    field.language_code: Glottocode
    field.parent_code: Family_ID
    field.lat: Latitude
    field.lon: Longitude
dimensions:
  - linguistic
  - geographic
links:
  - type: DESCENDS_FROM
    to: language
