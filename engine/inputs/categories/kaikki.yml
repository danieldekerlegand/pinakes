# kaikki.org (wiktextract) Wiktionary etymology extract, ingested via the dedicated
# `kaikki` JSONL adapter (src/pinakes_engine/acquire/kaikki.py).
#
# kaikki.org (docs/sources-linguistic.md) publishes machine-parsed Wiktionary as
# newline-delimited JSON — one object per word sense group — which sidesteps the
# "wikitext parsing is a research effort" blocker that kept a Wiktionary etymology
# ingest off the roadmap. Unlike a CLDF table, a kaikki entry is a NESTED object
# (its `etymology_templates` is a list of `{name, args}` template objects), so it
# needs a dedicated adapter rather than the column-rename tabular-dump adapter: the
# adapter reads each entry's etymology templates and maps the Wiktionary etymology
# vocabulary onto the canonical ontology edge :TYPEs.
#
# Each entry lands as a **Wordform** node keyed by its language (like Lexibank
# wordlists): field.name = the head `word`, field.lang = `lang_code` (the fuzzy-merge
# BLOCK key so forms of different languages are never compared, AND the reconciler's
# ISO 639-3 fallback key). The extracted etymology relations ride in an UNMAPPED
# `etymology_relations` cell -> the node's `extra` overflow, where the linguistic
# linker (ontology/linguistic.py) reads them back and emits one edge per relation:
#   bor/lbor/slbor/obor/ubor -> BORROWED_FROM   (borrowings)
#   inh/inherited/der/derived -> DERIVED_FROM    (inheritance & derivation)
#   cog/cognate               -> COGNATE_WITH    (cognates)
# Every OTHER template token (m/l/mention display helpers, ambiguous calques, and the
# `ncog`/`noncog` NON-cognate assertion) is unmappable: it is skipped and reported by
# the reconcile driver (schema/kaikki_reconcile.py), never coerced onto an edge type.
# Each edge points at a minimal Term node minted for the source-side (lang, term).
#
# Provenance: source=kaikki, license=CC-BY-SA-3.0 (Wiktionary is CC-BY-SA, dual GFDL
# — docs/sources-linguistic.md; a share-alike source, queryable by licence class).
# confidence=0.8 (curated-verified rubric class — machine-parsed from a curated
# encyclopaedia).
#
# `source.query` points at the committed fixture slice so the job runs out of the box
# and in CI (network-free). Repoint it at a real gitignored download (a kaikki.org
# per-language or all-words `*.jsonl` extract, https://kaikki.org/dictionary/) for the
# full corpus — the adapter streams JSONL line by line. See docs/kaikki-reconciliation.md.
id: kaikki
label: Wordform
description: kaikki.org Wiktionary etymology — wordforms with borrowed/derived/cognate edges.
source:
  type: dump
  query: tests/fixtures/kaikki/etymology.jsonl
  params:
    adapter: kaikki
    source: kaikki
    license: CC-BY-SA-3.0
    confidence: "0.8"
dimensions:
  - linguistic
links:
  - type: BORROWED_FROM
    to: term
  - type: DERIVED_FROM
    to: entity
  - type: COGNATE_WITH
    to: term
