# Pinakes — uv workspace root (docs/UNIFIED-PROJECT-PLAN.md §4).
#
# This file is a *virtual* workspace root: it has no `[project]` table, so it is
# not itself an installable package. Its only job is to tie the repo's Python
# packages into one resolution unit with a single root `uv.lock` and a single
# root `.venv`, so `pinakes` (the FastAPI service) and `pinakes_engine` can never
# drift apart on a shared dependency.
#
# Working with it:
#
#   uv sync --all-packages --all-extras   # from anywhere in the repo
#   uv run --project engine pytest        # engine suite (see the pytest note below)
#   uv run --package pinakes-engine ...    # run against one member explicitly
#
# `uv lock` regenerates the ROOT `uv.lock`; members no longer carry their own.
#
# The second line works from a cold checkout (no `.venv`, no prior sync) because a
# member's test toolchain lives in its `dev` DEPENDENCY GROUP — uv's default group
# — not in an extra, which uv would not install without a flag. Give every member
# a `dev` group for the same reason; see engine/pyproject.toml.

[tool.uv.workspace]
# `services/api` is the `pinakes` service package (FastAPI); `engine` is
# `pinakes-engine`. The service depends on the engine as a workspace member
# (services/api/pyproject.toml `[tool.uv.sources]`), never from PyPI — that is
# what makes "the engine is imported in-process" (plan §1) a resolution fact and
# not just an intention.
# `contracts/python` is `pinakes-contracts`: the GENERATED Python bindings for the
# language-neutral `contracts/*.json` (plan §10). Both other members depend on it,
# which is what makes "neither language is authoritative" a resolution fact rather
# than a convention — there is no hand-maintained Python copy of the schema left to
# drift. Regenerate with `npm run gen:contracts`.
members = ["contracts/python", "engine", "services/api"]

# The torch/pykeen/sentence-transformers ML workspace that used to live at `ml/`
# (and was excluded here so uv never claimed it) now lives in the private `lugh`
# repo — see docs/LUGH-EXTRACTION-PLAN.md. Nothing in this workspace depends on it;
# the app-side KFT surface dispatches to a lugh checkout resolved from `LUGH_ROOT`.

# NOTE — pytest configuration deliberately lives in the root `pytest.ini`, NOT in
# a `[tool.pytest.ini_options]` table here. pytest picks the FIRST ini-bearing
# file it finds in the rootdir and `pytest.ini` outranks `pyproject.toml`, so two
# sources of truth would silently disagree. If you ever move it in here, delete
# `pytest.ini` in the same commit.
