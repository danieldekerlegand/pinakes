# Material culture & dress — verified Wikidata classes for the culture corpus.
#
# 7 classes, ~17,871 entities. Each class's `instance of` (P31) count was
# verified live against the Wikidata Query Service (2026-06); the count after
# each entry is that observed value. Classes resolving to zero entities are not
# shipped.
#
# The domain captures the made objects of daily and ceremonial life, so every
# stub mints MADE_OF (the artifact's substance, modelled as a Getty AAT
# material) and ORIGINATES_FROM (where the form arose), so composition and
# provenance are queryable.
#
# Generate:  culturescrape generate blueprints/material-culture.yml \
#                --out categories --job jobs/material-culture.yml
defaults:
  label: Artifact;CulturalArtifact
  dimensions: [temporal, geographic, linguistic, genetic]
  links:
    - {type: MADE_OF, to: material}
    - {type: ORIGINATES_FROM, to: place}
categories:
  # — Clothing & garments —
  - id: clothing
    name: "type of clothing"
    label: Clothing;CulturalArtifact
    wikidata_class: Q11460  # clothing — ~1,470
  # — Textiles —
  - id: textiles
    name: "textile"
    label: Textile;CulturalArtifact
    wikidata_class: Q28823  # textile — ~3,982
  # — Crafts (handmade decorative and useful objects) —
  - id: crafts
    name: "handicraft"
    label: Craft;CulturalArtifact
    wikidata_class: Q877729  # handicraft — ~141
  # — Tools —
  - id: tools
    name: "tool"
    label: Tool;CulturalArtifact
    wikidata_class: Q39546  # physical tool — ~1,262
  # — Weapons —
  - id: weapons
    name: "weapon"
    label: Weapon;CulturalArtifact
    wikidata_class: Q728  # weapon — ~10,499
  # — Pottery & ceramics —
  - id: ceramics
    name: "ceramic"
    label: Ceramic;CulturalArtifact
    wikidata_class: Q45621  # ceramic — ~438
  # — Currency —
  - id: currency
    name: "currency"
    label: Currency;CulturalArtifact
    wikidata_class: Q8142  # currency — ~1,019
