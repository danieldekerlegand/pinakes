{% extends "base.html" %}
{% block title %}Edges · culture-scrape explorer{% endblock %}
{% block content %}
  <h1>Edges</h1>
  <p class="muted"><a href="/nodes">Nodes</a> · <strong>Edges</strong></p>
  <form method="get" action="/edges">
    <label>:TYPE
      <select name="type">
        <option value="">all</option>
        {% for t in types %}
        <option value="{{ t }}"{% if t == type %} selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
    </label>
    <label>search
      <input type="search" name="q" value="{{ q }}" placeholder="start or end csid">
    </label>
    <button type="submit">Filter</button>
  </form>
  <p class="muted">{{ page.total }} edge{{ "" if page.total == 1 else "s" }}
    {% if type or q %}matched{% endif %}</p>
  {% include "_table.html" %}
{% endblock %}
