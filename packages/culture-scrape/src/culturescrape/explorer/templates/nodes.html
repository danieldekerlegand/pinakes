{% extends "base.html" %}
{% block title %}Nodes · culture-scrape explorer{% endblock %}
{% block content %}
  <h1>Nodes</h1>
  <p class="muted"><strong>Nodes</strong> · <a href="/edges">Edges</a></p>
  <form method="get" action="/nodes">
    <label>:LABEL
      <select name="label">
        <option value="">all</option>
        {% for l in labels %}
        <option value="{{ l }}"{% if l == label %} selected{% endif %}>{{ l }}</option>
        {% endfor %}
      </select>
    </label>
    <label>search
      <input type="search" name="q" value="{{ q }}" placeholder="name or csid">
    </label>
    <button type="submit">Filter</button>
  </form>
  <p class="muted">{{ page.total }} node{{ "" if page.total == 1 else "s" }}
    {% if label or q %}matched{% endif %}</p>
  {% include "_table.html" %}
{% endblock %}
