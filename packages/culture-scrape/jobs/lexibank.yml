# Lexibank wordlist corpus job — acquire + normalize + stitch + link the ABVD
# CLDF wordlist into a graph-side corpus. Run with:
#   uv run culturescrape run jobs/lexibank.yml
#
# Ingests the Lexibank ABVD wordlist (categories/lexibank-abvd.yml, CC-BY-4.0) via
# the tabular-dump adapter as language-keyed **Wordform** attribute-fact nodes, and
# links each cognate set's forms into a COGNATE_WITH representative star (the
# linguistic linker reads the mapped `cognateset` field). Points at the committed
# fixture slice by default (network-free); repoint the category's source.query at a
# denormalised full download to build the whole ~2,000-doculect catalogue.
# Output lands under out/lexibank/ (gitignored).
#
# min_component_fraction is relaxed to 0.0: wordform nodes connect only through the
# cognate stars, so the corpus fragments into one component per cognate set (plus the
# synthetic type/category hubs) rather than the single connected genealogy the
# multi-domain seed corpus requires — the language join is the reconciliation
# (schema/lexibank_reconcile.py), not descent connectivity, exactly as for the
# WALS/PHOIBLE typology job.
name: lexibank
description: Lexibank ABVD wordlist — forms keyed by glottocode with COGNATE_WITH cognate stars.
categories:
  - ../categories/lexibank-abvd.yml
output_root: ../out/lexibank
min_component_fraction: 0.0
