# Ingest the Pinakes canonical export as a first-class acquisition source,
# then stitch + link + export it as a self-contained convergence corpus.
# Run end to end with: culturescrape run jobs/pinakes.yml
#
# The single category reads Pinakes's nodes/*.tsv + edges/*.tsv export
# (docs/reconcile-pinakes.md) through the `pinakes-export` adapter.
# Paths resolve against this file's directory, so the category lives one level
# up in categories/ and output lands under the repo-root out/ tree.
#
# The two relaxed floors below suit a Pinakes-only convergence corpus (see
# docs/convergence-build.md): its rows carry the canonical `source` stamp but no
# external `source_url` (Pinakes records none), so the generic provenance
# floor is relaxed — provenance is still enforced by the Pinakes provenance
# QA gate — and a small single-domain corpus need not reach the multi-domain
# seed corpus's connectivity. A truly merged corpus (native Wikidata + this
# source) meets both defaults and can drop these overrides.
name: pinakes
description: Pinakes convergence — ingest its canonical nodes/edges export.
categories:
  - ../categories/pinakes.yml
output_root: ../out/pinakes
min_provenance_completeness: 0.0
min_component_fraction: 0.5
