# Canonical example category. Load with culturescrape.acquire.load_category().
# Schema: docs/data-model.md ("Category specification (input)").
id: peruvian-dishes
label: Dish;CulturalArtifact
description: Every Peruvian dish
source:
  type: wikidata-sparql
  query: |
    SELECT ?item ?itemLabel ?image WHERE {
      ?item wdt:P31 wd:Q746549 .          # instance of: Peruvian dish (illustrative)
      SERVICE wikibase:label { bd:serviceParam wikibase:language "en,es". }
    }
dimensions: [temporal, geographic, linguistic]
links:
  - type: ORIGINATES_FROM
    to: place
