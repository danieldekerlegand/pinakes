# Pinakes canonical export ingested as a first-class acquisition source.
#
# Pinakes (tasklist 15 / `scripts/export-for-culturescrape.ts`) writes its
# lexicons out in the shared canonical shape (docs/data-model.md): a directory
# of typed Neo4j-import TSVs under nodes/ and edges/. The `pinakes-export`
# adapter reads that directory and yields one RawRecord per row, stamping
# provenance source=pinakes (docs/reconcile-pinakes.md).
#
# `source.query` names the export root. It points at the committed fixture
# export here so the job is runnable out of the box; repoint it at the real
# export (e.g. ../../../export/culturescrape) to ingest the live corpus. The
# path resolves relative to the working directory `culturescrape run` is invoked
# from (the package root).
id: pinakes
label: Entity   # placeholder: each exported row carries its own :LABEL.
description: Pinakes's canonical nodes/edges export, ingested as a first-class source.
source:
  type: dump
  query: tests/fixtures/pinakes/export
  params:
    adapter: pinakes-export
    source: pinakes
dimensions:
  - temporal
  - geographic
  - linguistic
  - genetic
links: []
