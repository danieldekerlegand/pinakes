# Conflicts & historical events — verified Wikidata classes for the culture corpus.
#
# 14 classes, ~38,269 entities. Each class's `instance of`
# (P31) count was verified live against the Wikidata Query Service (2026-06);
# the count after each entry is that observed value.
#
# Generate:  culturescrape generate blueprints/conflicts.yml \
#                --out categories --job jobs/conflicts.yml
defaults:
  label: Event
  dimensions: [temporal, geographic]
  links:
    - {type: LOCATED_IN, to: place}
