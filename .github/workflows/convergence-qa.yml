name: convergence-qa

# Data-population attribution / QA gate (US-001). Enforces two hard rules on every
# push so scaled cultural/historical data stays credible:
#   1. Attribution — every acquisition-imported lexicon row (a row carrying a
#      `wikidata_qid`) must have full provenance (source / source_url / retrieved_at /
#      confidence). Reads data/source/lexicons/*.tsv, the source of truth.
#   2. Regression ratchet — dedup / reconciliation metrics may not climb above the
#      committed ceilings in docs/convergence-qa-baseline.json.
# Plus the existing schema-drift check. Both projects' toolchains run here so a data
# change lands green only when TS + Python checks pass. Runbook:
# docs/data-population-runbook.md. Gate internals: docs/canonical-schema.md §10.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  convergence-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (web app)
        run: npm run check
      - name: Typecheck (scripts)
        run: npx tsc -p scripts/tsconfig.json
      - name: Convergence-QA unit tests
        run: npx vitest run scripts/convergence-qa.test.ts
      - name: Attribution / dedup / drift gate
        run: npm run convergence-qa

  pinakes-engine:
    # Pinned to 22.04 (jammy): the official souffle-lang apt repo ships a .deb
    # that depends on libffi7, which exists on jammy but not on ubuntu-latest
    # (24.04 / noble ships libffi8). This lets swipl + souffle install via plain
    # apt so the engine-gated Datalog tests execute instead of skipping.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Install logic engines (swi-prolog + souffle)
        # swi-prolog is in the Ubuntu archive; souffle is not, so add the
        # official souffle-lang apt repo. With both present the previously
        # skipif-gated engine tests (tests/test_datalog_*.py) actually run.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog wget gnupg ca-certificates
          wget -qO- https://souffle-lang.github.io/ppa/souffle-key.public \
            | sudo gpg --dearmor -o /usr/share/keyrings/souffle-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/souffle-archive-keyring.gpg] https://souffle-lang.github.io/ppa/ubuntu/ stable main" \
            | sudo tee /etc/apt/sources.list.d/souffle.list
          sudo apt-get update
          sudo apt-get install -y souffle
          swipl --version
          souffle --version
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync Python deps
        # The dev toolchain (ruff/mypy/pytest) is the `dev` dependency GROUP, which
        # uv installs by default — including the gui (fastapi/uvicorn) and neo4j
        # extras it self-references, which mypy --strict needs to typecheck the
        # explorer app. --all-extras adds the one extra the group leaves out,
        # `graphrag` (sentence-transformers), so the vector-index tests run here
        # instead of skipping.
        run: uv sync --frozen --all-extras
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Typecheck (mypy)
        run: uv run mypy src
      - name: Tests (pytest)
        run: uv run pytest
