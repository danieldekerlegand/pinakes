name: secret-scan

# Full-tree secret scan (US-003). Fails the build if any tracked file contains a
# .env leak, a provider-prefixed key, a private-key block, or a secret-named
# variable assigned a high-entropy value. See docs/SECURITY.md "Secret scanning".
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Scan tracked tree for secrets
        run: npm run secret-scan
