name: e2e

# Playwright e2e smoke (US-006). Boots the TSV-backed dev server and drives the
# core flows (dashboard shell, Leaflet map, UnifiedExplorer, a graph feature) in
# headless Chromium. The shared graph (Neo4j + pinakes-engine sidecar) is
# OPTIONAL — the smoke asserts the graceful-degrade affordance when it is down —
# so this job needs nothing but the app itself. See docs/SECURITY.md
# "End-to-end verification".
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      - name: Run e2e smoke
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
