[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinakes-ml"
version = "0.1.0"
description = "ML / neurosymbolic workspace for pinakes — triples export, PyKEEN baselines, ProbLog, DVC + MLflow (NEUROSYMBOLIC_ROADMAP.md Phase 2)."
readme = "README.md"
# Kept a separate uv workspace from packages/culture-scrape so the sidecar
# Docker image stays slim (no torch/pykeen). Pinned to 3.11 — the ML stack
# (pykeen/torch wheels) lags the newest interpreters.
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    # Statistical / embedding stack. torch ships MPS on Apple Silicon and CPU
    # everywhere else — pykeen picks the device at runtime (no code change).
    "torch>=2.2",
    "pykeen>=1.10",
    # Probabilistic logic — pure-Python, no engine install (the DeepProbLog on-ramp).
    "problog>=2.2",
    # Text embeddings for GraphRAG / entity descriptions (Phase 5), and the HF
    # datasets format for fine-tuning generators.
    "sentence-transformers>=2.2",
    "datasets>=2.14",
    # Experiment tracking (local file backend) + dataset/artifact versioning.
    "mlflow>=2.9",
    "dvc>=3.0",
]

# NOTE — scallopy (neurosymbolic pilot, roadmap Phase 5.4) is intentionally NOT a
# declared dependency: its only published wheel (0.1.0) is cp39-only, so it does
# not resolve on this workspace's Python 3.11 and uv locks all extras into one
# universal lock (a broken extra breaks the whole sync). It is a Phase-5 concern,
# not needed for the Phase-2 loop; install it manually into the venv when the
# pilot starts (`uv pip install scallopy`, on a compatible interpreter). Keeping
# it out keeps the core env — the CI import smoke torch/pykeen/problog — green.

[project.scripts]
# US-002 reproducer — also runnable as `python -m pinakes_ml.export_triples`.
pinakes-export-triples = "pinakes_ml.export_triples:main"
# Phase-5 US-002 (Scallop pilot) — training-query generator (positives +
# type-constrained negatives); also runnable as `python -m pinakes_ml.export_queries`.
pinakes-export-queries = "pinakes_ml.export_queries:main"
# Phase-5 US-002 reproducer — triple-verbalization JSONL for LLM fine-tuning;
# also runnable as `python -m pinakes_ml.export_verbalizations`.
pinakes-export-verbalizations = "pinakes_ml.export_verbalizations:main"
# Phase-5 US-003 reproducer — multi-hop KG-grounded QA JSONL; also runnable as
# `python -m pinakes_ml.export_kgqa`.
pinakes-export-kgqa = "pinakes_ml.export_kgqa:main"
# Phase-5 US-003 OPTIONAL Gemini-polish variant (never required for CI); also
# runnable as `python -m pinakes_ml.polish_kgqa`.
pinakes-polish-kgqa = "pinakes_ml.polish_kgqa:main"
# US-003 reproducer — also runnable as `python -m pinakes_ml.train_baselines`.
pinakes-train-baselines = "pinakes_ml.train_baselines:main"
# Phase-5 US-001 Scallop context export + Horn-rule translation; also runnable as
# `python -m pinakes_ml.export_scallop`. `--smoke` needs the undeclared
# `scallopy` (macOS/arm64 wheel) — see docs/scallop-pilot.md.
pinakes-export-scallop = "pinakes_ml.export_scallop:main"
# Phase-5 US-004 KGQA eval tier 3 — also `python -m pinakes_ml.eval_kgqa`.
pinakes-eval-kgqa = "pinakes_ml.eval_kgqa:main"
# US-005 consistency ratchet (pure — no torch) — also `python -m
# pinakes_ml.check_consistency`.
pinakes-check-consistency = "pinakes_ml.check_consistency:main"
# Phase-5 US-005 QLoRA fine-tuning pipeline (verbalization + QA JSONL -> tuned
# adapter, before/after KGQA eval); also `python -m pinakes_ml.train_finetune`.
# Needs the undeclared training stack (`uv pip install trl peft accelerate`).
pinakes-finetune = "pinakes_ml.train_finetune:main"
# Phase-5 US-003 rule-guided link predictor (neural edge scorer + min-max ancestor
# rule); also `python -m pinakes_ml.train_scallop`. The engine-free reference
# runs anywhere; the scallopy `minmaxprob` program is local-only (macOS/arm64).
pinakes-train-scallop = "pinakes_ml.train_scallop:main"
# Phase-5 US-004 DeepProbLog feasibility run — measures the ProbLog exact-inference
# scale ceiling + the Scallop-vs-DeepProbLog comparison; also `python -m
# pinakes_ml.train_deepproblog`. `problog` is declared (runs anywhere); the
# `deepproblog` neural-AD loop is undeclared + gated (docs/neurosymbolic-pilot-report.md).
pinakes-deepproblog = "pinakes_ml.train_deepproblog:main"
# analyzer-bridge US-005 (Bridge 3) — edit-ops SLM datasets over the Analyzer exhaust
# (nl-edit + preference JSONL -> SFT + preference pairs); also `python -m
# pinakes_ml.export_edit_ops`. Personal-tier: real datasets are local/DVC only.
pinakes-export-edit-ops = "pinakes_ml.export_edit_ops:main"
# analyzer-bridge US-005 — cinematography-adherence eval tier (shot configs + the
# Analyzer constraint vocabulary -> violation counts by rule/severity); also
# `python -m pinakes_ml.eval_cinematography`. `--check` is the ratchet gate.
pinakes-eval-cinematography = "pinakes_ml.eval_cinematography:main"
# insimul-bridge US-004 — Prolog rule-adherence eval tier 4, the VESPACE port
# (candidate rules + a CanonicalWorldExport -> parse / schema / referential
# validity + reachability + fireability); also `python -m
# pinakes_ml.eval_rule_adherence`. `--check` is the ratchet gate. Metric
# definitions: docs/rule-adherence-tier.md.
pinakes-eval-rule-adherence = "pinakes_ml.eval_rule_adherence:main"
# insimul-bridge US-005 — Insimul SLM dataset generators (converted worlds ->
# rule-authoring SFT + preference pairs + lore-consistency QA, with a per-world
# held-out split and a mock-model adherence smoke); also `python -m
# pinakes_ml.export_insimul_datasets`. `--check` is the manifest ratchet.
# Everything it emits is synthetic tier / proprietary — DVC data, never git.
pinakes-export-insimul = "pinakes_ml.export_insimul_datasets:main"
# slm-pilot US-001 — the pilot's FROZEN evaluation protocol (held-out rule
# prompts -> the eval set + the metric list, comparison points, ablation arms
# and the measured-volume `insufficient-data` floor); also `python -m
# pinakes_ml.export_slm_eval`. `--check` is the freeze gate.
# Prose half: docs/slm-pilot-protocol.md.
pinakes-export-slm-eval = "pinakes_ml.export_slm_eval:main"
# slm-pilot US-002 — the pilot's config-driven QLoRA pipeline (rule-SFT ->
# fine-tune -> tier-4 adherence on the FROZEN eval set, both prompt arms); also
# `python -m pinakes_ml.train_slm`. `--stub` runs the whole loop with no model
# and no undeclared deps (the CI smoke); a real run needs
# `uv pip install trl peft accelerate`. Runbook: docs/slm-pilot-runbook.md.
pinakes-train-slm = "pinakes_ml.train_slm:main"
# slm-pilot US-004 — the deployment leg (merge the LoRA adapter -> GGUF ->
# Q4_K_M -> tier-4 adherence under llama.cpp, vs the HF-stack scores on the same
# frozen eval set) plus the prompt-template contract Insimul's LocalAIService
# must send; also `python -m pinakes_ml.export_gguf`. `--contract-only` and
# `--dry-run` are pure (the CI-safe smokes); a real conversion needs the
# undeclared `llama-cpp-python`/`gguf` and a built llama.cpp checkout.
# Contract: docs/slm-prompt-contract.md.
pinakes-export-gguf = "pinakes_ml.export_gguf:main"
# slm-pilot US-005 — the Insimul handoff bundle (the GGUF's model manifest, the
# prompt contract, the frozen eval set for re-verification and the license
# notes, assembled beside the model in the DVC-tracked ml/models/slm-pilot);
# also `python -m pinakes_ml.export_handoff`. `--dry-run` touches nothing and
# `--check` is the re-verification gate (the eval-set hash tier runs in CI).
# Runbook: docs/slm-insimul-runbook.md.
pinakes-export-handoff = "pinakes_ml.export_handoff:main"
# edit-ops-slm-pilot US-001 — the Analyzer pilot's FROZEN evaluation protocol (the
# hand-written per-op + refusal cases plus the held-out runs' exhaust instructions
# -> the eval set, the metric list with its ORACLES, the comparison points, the
# three prompt arms, the success bar and the measured-volume `insufficient-data`
# floor); also `python -m pinakes_ml.export_edit_ops_eval`. `--check` is the freeze
# gate. Prose half: docs/edit-ops-slm-protocol.md.
pinakes-export-edit-ops-eval = "pinakes_ml.export_edit_ops_eval:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
