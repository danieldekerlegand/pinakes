# `pinakes-contracts` — the generated Python bindings for `contracts/*.json`.
#
# A uv workspace member (see the repo-root `pyproject.toml` `[tool.uv.workspace]`)
# so `pinakes-engine` and `pinakes` (the FastAPI service) resolve it from the
# checkout, never from PyPI. It is the Python half of the language-neutral
# contract (docs/UNIFIED-PROJECT-PLAN.md §10): every module under
# `src/pinakes_contracts/` except `_documents.py` is GENERATED by
# `scripts/gen-contract-bindings.ts` from the JSON one directory up.
#
# It has no runtime dependencies on purpose — the contract vocabulary must be
# importable from anywhere in the stack (the engine's schema layer imports it at
# module scope) without dragging a dependency graph along.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinakes-contracts"
version = "0.1.0"
description = "Generated Python bindings for the language-neutral Pinakes contracts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

# `dev` is one of uv's default groups, so `uv run --all-packages ruff/mypy` picks
# these up from a cold checkout with no flags — same reasoning as the other members.
[dependency-groups]
dev = [
    "mypy>=1.8",
    "pytest>=8",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pinakes_contracts = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.ruff]
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The generated modules embed the contract's own prose (column descriptions,
# rationales) verbatim as string literals, so line length is a property of the
# JSON, not of anything a formatter could fix.
ignore = ["E501"]
