[pytest]
# Repo-root default. There are TWO Python suites in this one uv workspace
# (docs/UNIFIED-PROJECT-PLAN.md §4): `engine/` and `services/api/`. Bare `pytest`
# from the repo root would otherwise try to collect BOTH of them into whichever env
# it was launched with and die on imports, so pin the root default to the two
# suites that share the root `.venv`. (A third, torch-isolated ML suite used to sit
# at `ml/`; it left for the private `lugh` repo — docs/LUGH-EXTRACTION-PLAN.md.)
#
# Both are listed because both members resolve into that ONE venv — `uv run
# --project engine pytest` and `uv run --project services/api pytest` differ only
# in which member's deps uv guarantees are present, not in `sys.path`, and
# neither changes the working directory, so neither can narrow this list. Scope a
# run by passing a path (`pytest services/api/tests`), not by editing this.
testpaths = engine/tests services/api/tests
