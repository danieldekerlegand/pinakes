[pytest]
# Repo-root default. There are THREE Python suites across TWO uv workspaces
# (docs/UNIFIED-PROJECT-PLAN.md §4): the root workspace's `engine/` and
# `services/api/`, and the torch-isolated ML workspace `ml/`. Bare `pytest` from
# the repo root would otherwise try to collect ALL of them into whichever env it
# was launched with and die on imports, so pin the root default to the two
# suites that share the root `.venv`.
#
# Both are listed because both members resolve into that ONE venv — `uv run
# --project engine pytest` and `uv run --project services/api pytest` differ only
# in which member's deps uv guarantees are present, not in `sys.path`, and
# neither changes the working directory, so neither can narrow this list. Scope a
# run by passing a path (`pytest services/api/tests`), not by editing this.
#
# `ml/` is unaffected: its `pyproject.toml` carries its own
# `[tool.pytest.ini_options]`, so pytest stops there and never reaches this file.
testpaths = engine/tests services/api/tests
