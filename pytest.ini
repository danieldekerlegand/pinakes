[pytest]
# Repo-root default. There are TWO Python suites and they live in TWO uv
# workspaces (docs/UNIFIED-PROJECT-PLAN.md §4): the engine (`engine/`) and the
# torch-isolated ML workspace (`ml/`). Bare `pytest` from the repo root would
# otherwise try to collect BOTH into whichever env it was launched with and die
# on imports, so pin the root default to the engine suite — that is what
# `uv run --project engine pytest` from here means.
#
# `ml/` is unaffected: its `pyproject.toml` carries its own
# `[tool.pytest.ini_options]`, so pytest stops there and never reaches this file.
testpaths = engine/tests
